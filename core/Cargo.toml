[package]
name = "phantompos-core"
description = "ESC/POS parser and receipt model for PhantomPOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Serialization of the command log and receipt model (JSON contract with the UI).
serde = { version = "1.0.229", features = ["derive"] }
# QR Code generation (GS ( k): pure Rust, no I/O; default features (image,
# svg, pic renderers) are off, so it pulls in no other crate.
qrcode = { version = "0.14.1", default-features = false }
# Typed errors, as required by the project conventions.
thiserror = "2.0.21"

[dev-dependencies]
# Fixture JSON (expected commands + receipt) in the integration tests.
serde_json = "1.0.154"
