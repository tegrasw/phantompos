[package]
name = "phantompos"
description = "Virtual ESC/POS thermal printer"
default-run = "phantompos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the `phantompos`
# binary (see https://github.com/rust-lang/cargo/issues/8519).
name = "phantompos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phantompos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
# IPv4 addresses of the network interfaces, shown in network mode (std
# cannot list them). Small: only libc / windows-sys.
if-addrs = "0.15.0"
phantompos-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
# Settings file (already in the tree through tauri).
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = [] }
# Native save dialog for `export_receipt`, called from Rust only (no JS
# package, no webview permission).
tauri-plugin-dialog = "2.8.4"
# Opens the fixed About links (`open_link`) in the system browser, called
# from Rust only (no JS package, no webview permission).
tauri-plugin-opener = "2.7.3"
thiserror = "2.0.21"
# `sync`: the watch channel that publishes the simulated printer state to
# the connection tasks (Automatic Status Back).
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

