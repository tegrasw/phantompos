[package]
name = "phantompos"
description = "Virtual ESC/POS thermal printer"
default-run = "phantompos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the `phantompos`
# binary (see https://github.com/rust-lang/cargo/issues/8519).
name = "phantompos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phantompos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
phantompos-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.6", features = [] }
thiserror = "2.0.21"
# `sync`: the watch channel that publishes the simulated printer state to
# the connection tasks (Automatic Status Back).
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
