name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never writes to the repository and never signs anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to a PR are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Stage 1 runs a single Linux job. The parser crate is platform-independent
    # and release.yml builds the app on all three systems at every tag.
    name: Lint, test and build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        # https://v2.tauri.app/start/prerequisites/#linux (Debian/Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain from rust-toolchain.toml
        # With no arguments, rustup installs the toolchain (and components)
        # pinned by rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache; PRs restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: app
        run: pnpm check

      - name: Build frontend
        # Must run before any compilation of the app crate:
        # tauri::generate_context! embeds app/dist at compile time.
        working-directory: app
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
